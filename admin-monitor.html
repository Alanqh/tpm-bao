<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源包监控 - 资源包管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .switcher-tab {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      color: #cbd5e1;
      font-size: 0.8125rem;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .switcher-tab:hover { background: rgba(255,255,255,0.1); color: white; }
    .switcher-tab.active { background: #6e29f6; color: white; }

    .admin-sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      color: #374151;
      font-size: 0.8125rem;
      transition: all 0.15s;
    }
    .admin-sidebar-link:hover { background: #F3F4F6; color: #7C3AED; }
    .admin-sidebar-link.active { background: #F5F3FF; color: #7C3AED; font-weight: 500; }
  </style>
</head>
<body class="bg-[#F3F4F6] text-slate-800">
  <!-- 原型切换栏 -->
  <div class="sticky top-0 z-[100] bg-slate-900 text-white text-sm border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center h-10 gap-1 overflow-x-auto">
        <span class="text-slate-400 mr-2 flex-shrink-0 text-xs"><i class="fa-solid fa-layer-group mr-1"></i>原型导航</span>
        <a href="index.html" class="switcher-tab">官网首页</a>
        <a href="terms.html" class="switcher-tab">购买须知</a>
        <a href="packages.html" class="switcher-tab">资源包</a>
        <a href="pipeline.html" class="switcher-tab">监控数据链路</a>
        <a href="admin-packages.html" class="switcher-tab active">后台管理</a>
      </div>
    </div>
  </div>

  <!-- 顶部 Header -->
  <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 sticky top-10 z-50">
    <div class="flex items-center gap-4">
      <button class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-md">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold">SF</div>
        <span class="font-semibold text-slate-900 text-sm">硅基流动</span>
      </div>
      <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>
      <h1 class="text-slate-700 text-sm font-medium hidden sm:block">资源包监控</h1>
    </div>
    <div class="flex items-center gap-3">
      <button class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full">
        <i class="fa-regular fa-moon"></i>
      </button>
      <button class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full">
        <i class="fa-regular fa-bell"></i>
      </button>
      <div class="w-7 h-7 rounded-full bg-violet-100 text-violet-700 flex items-center justify-center text-xs font-medium">吕</div>
    </div>
  </header>

  <div class="flex">
    <!-- 左侧 Sidebar：高亮保持「资源包管理」 -->
    <aside class="w-56 bg-white border-r border-slate-200 flex-shrink-0 hidden md:flex flex-col h-[calc(100vh-3.5rem-2.5rem)] sticky top-[6rem]">
      <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto text-sm">
        <div class="flex items-center gap-2 text-slate-500 px-2 py-2 cursor-pointer hover:text-slate-700">
          <i class="fa-solid fa-chevron-down text-xs"></i>
          <span>管理后台</span>
        </div>

        <div class="flex items-center gap-2 text-slate-500 px-2 py-2 cursor-pointer hover:text-slate-700">
          <i class="fa-solid fa-chevron-down text-xs"></i>
          <span>账户中心</span>
        </div>

        <div class="flex items-center gap-2 text-slate-500 px-2 py-2 cursor-pointer hover:text-slate-700">
          <i class="fa-solid fa-chevron-down text-xs"></i>
          <span>活动运营</span>
        </div>

        <div class="pl-6 space-y-0.5">
          <a href="admin-packages.html" class="admin-sidebar-link active"><i class="fa-solid fa-box-open w-4 text-center"></i>资源包管理</a>
          <a href="admin-monitor.html" class="admin-sidebar-link"><i class="fa-solid fa-chart-line w-4 text-center"></i>资源包监控</a>
        </div>

        <div class="flex items-center gap-2 text-slate-500 px-2 py-2 cursor-pointer hover:text-slate-700" onclick="toggleMenu('maas-menu', this)">
          <i class="fa-solid fa-chevron-right text-xs transition-transform"></i>
          <span>MaaS 运营管理</span>
        </div>

        <div id="maas-menu" class="pl-6 space-y-0.5 hidden">
          <a href="#" class="admin-sidebar-link"><i class="fa-solid fa-server w-4 text-center"></i>客户任务/数据</a>
          <a href="#" class="admin-sidebar-link"><i class="fa-solid fa-layer-group w-4 text-center"></i>Serverless 管理</a>
          <a href="#" class="admin-sidebar-link"><i class="fa-solid fa-link w-4 text-center"></i>MaaS 专属端点</a>
          <a href="#" class="admin-sidebar-link"><i class="fa-solid fa-brain w-4 text-center"></i>推理服务</a>
          <a href="#" class="admin-sidebar-link"><i class="fa-solid fa-flask w-4 text-center"></i>Playground</a>
        </div>

        <div class="flex items-center gap-2 text-slate-500 px-2 py-2 cursor-pointer hover:text-slate-700">
          <i class="fa-solid fa-chevron-down text-xs"></i>
          <span>弹性 GPU 运营管理</span>
        </div>

        <div class="flex items-center gap-2 text-slate-500 px-2 py-2 cursor-pointer hover:text-slate-700">
          <i class="fa-solid fa-chevron-down text-xs"></i>
          <span>商品定价中心</span>
        </div>

        <div class="flex items-center gap-2 text-slate-500 px-2 py-2 cursor-pointer hover:text-slate-700">
          <i class="fa-solid fa-chevron-down text-xs"></i>
          <span>平台管理</span>
        </div>
      </nav>
    </aside>

    <!-- 主内容区：嵌入统一监控组件 -->
    <main class="flex-1 min-w-0 bg-[#F3F4F6]">
      <iframe id="monitor-iframe" src="monitor-component.html?mode=admin" class="w-full" style="height: calc(100vh - 6rem); border: none;" title="资源包监控"></iframe>
    </main>
  </div>

  <script>
    function toggleMenu(id, el) {
      const menu = document.getElementById(id);
      menu.classList.toggle('hidden');
      el.querySelector('i').classList.toggle('rotate-90');
    }

    const params = new URLSearchParams(window.location.search);
    const pkg = params.get('pkg') || 'P001';
    document.getElementById('monitor-iframe').src = `monitor-component.html?mode=admin&pkg=${encodeURIComponent(pkg)}`;
  </script>
</body>
</html>
