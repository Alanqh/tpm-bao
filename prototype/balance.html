  <style>
    :root { --sf-purple: #7C3AED; --sf-purple-light: #F5F3FF; }
    .sf-sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1rem; border-radius: 0.5rem; color: #475569; font-size: 0.875rem; transition: all 0.15s; }
    .sf-sidebar-link:hover { background: #F5F3FF; color: #7C3AED; }
    .sf-sidebar-link.active { background: #F5F3FF; color: #7C3AED; font-weight: 500; }
    .sf-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; }
    .sf-btn-primary { background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%); color: white; }
    .sf-btn-primary:hover { opacity: 0.95; }
    .switcher-tab {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      color: #cbd5e1;
      font-size: 0.8125rem;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .switcher-tab:hover { background: rgba(255,255,255,0.1); color: white; }
    .switcher-tab.active { background: #6e29f6; color: white; }

    .package-card-tab {
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }
    .package-card-tab:hover { border-color: #C4B5FD; }
    .package-card-tab.active { border-color: #7C3AED; box-shadow: 0 0 0 1px #7C3AED; }
    .package-card-tab.active .pct-number { color: #7C3AED; }

    .filter-btn {
      padding: 0.375rem 0.875rem;
      border: 1px solid #E2E8F0;
      border-radius: 9999px;
      font-size: 0.8125rem;
      color: #475569;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: #C4B5FD; color: #7C3AED; }
    .filter-btn.active { background: #F5F3FF; border-color: #7C3AED; color: #7C3AED; font-weight: 500; }

    .package-type-badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
    .usage-bar { width: 100%; background: #F1F5F9; border-radius: 9999px; height: 6px; overflow: hidden; }
    .usage-bar-fill { height: 100%; border-radius: 9999px; transition: width 0.3s ease; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800">

  <header class="h-16 bg-gradient-to-r from-violet-600 to-indigo-600 flex items-center justify-between px-6 sticky top-10 z-50">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 text-white">

    <div class="flex items-center gap-4">

  <div class="flex">
    <aside class="w-60 bg-white border-r border-slate-200 flex-shrink-0 hidden md:flex flex-col h-[calc(100vh-4rem)] sticky top-[6.5rem]">
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
        <div class="text-xs text-slate-400 px-3 py-2">模型</div>
        <a href="index.html" class="sf-sidebar-link"><i class="fa-solid fa-cube w-4"></i>模型广场</a>
        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-layer-group w-4"></i>批量推理</a>

        <div class="text-xs text-slate-400 px-3 py-2 mt-4">模型中心</div>
        <a href="#" class="sf-sidebar-link"><i class="fa-regular fa-comment w-4"></i>文本对话</a>

        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-microphone w-4"></i>语音合成</a>

        <div class="flex items-center gap-2 text-xs text-slate-400 px-3 py-2 mt-4">
          <span>弹性 GPU</span>
          <span class="px-1.5 py-0.5 rounded bg-violet-100 text-violet-600 text-[10px]">Beta</span>
        </div>

        <div class="text-xs text-slate-400 px-3 py-2 mt-4">账户管理</div>
        <a href="#" class="sf-sidebar-link"><i class="fa-regular fa-user w-4"></i>实名认证</a>
        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-key w-4"></i>API 密钥</a>
        <a href="balance.html" class="sf-sidebar-link active"><i class="fa-solid fa-wallet w-4"></i>余额充值</a>
        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-file-invoice-dollar w-4"></i>费用明细</a>

        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-book w-4"></i>文档中心 <i class="fa-solid fa-chevron-right text-xs ml-auto text-slate-300"></i></a>
        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-gift w-4"></i>推荐官计划</a>
        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-headset w-4"></i>工单反馈 <i class="fa-solid fa-chevron-right text-xs ml-auto text-slate-300"></i></a>
        <a href="#" class="sf-sidebar-link"><i class="fa-solid fa-handshake w-4"></i>商务合作 <i class="fa-solid fa-chevron-right text-xs ml-auto text-slate-300"></i></a>
      </nav>
      <div class="p-4 text-xs text-slate-400 border-t border-slate-100">
        Beijing-GuiJiLiuDongAIYun<br>FuWu-20251201S0112
      </div>
    </aside>

    <main class="flex-1 p-6 min-w-0">
      <!-- 顶部卡片式 Tab -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <button type="button" class="package-card-tab" data-tab="balance" onclick="switchBalanceTab('balance')">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center"><i class="fa-solid fa-yen-sign"></i></div>
            <span class="text-sm font-medium text-slate-700">余额</span>
          </div>
          <p class="text-2xl font-bold text-slate-900 pct-number">¥0.00</p>
          <p class="text-xs text-slate-400 mt-1">剩余可透支额度 ¥0</p>
        </button>

        <button type="button" class="package-card-tab" data-tab="voucher" onclick="switchBalanceTab('voucher')">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-8 h-8 rounded-full bg-violet-50 text-violet-500 flex items-center justify-center"><i class="fa-solid fa-ticket"></i></div>
            <span class="text-sm font-medium text-slate-700">代金券</span>
          </div>
          <p class="text-2xl font-bold text-slate-900 pct-number">0 <span class="text-base font-normal text-slate-500">张可用</span></p>
        </button>

        <button type="button" class="package-card-tab active" data-tab="package" onclick="switchBalanceTab('package')">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-8 h-8 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center"><i class="fa-solid fa-box-open"></i></div>
            <span class="text-sm font-medium text-slate-700">资源包</span>
          </div>
          <p class="text-2xl font-bold text-slate-900 pct-number"><span id="package-active-count">0</span> <span class="text-base font-normal text-slate-500">个生效中</span></p>
        </button>
      </div>

      <!-- 余额 Tab（占位） -->
      <div id="tab-balance" class="hidden">
        <div class="sf-card p-8 text-center text-slate-400 text-sm">
          余额充值功能原型占位，实际请使用平台收银台完成充值。
        </div>
      </div>

      <!-- 代金券 Tab（占位） -->
      <div id="tab-voucher" class="hidden">
        <div class="sf-card p-8 text-center text-slate-400 text-sm">
          代金券功能原型占位。
        </div>
      </div>

      <!-- 资源包 Tab -->
      <div id="tab-package">
        <div class="sf-card overflow-hidden p-6">
          <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4 mb-6">
            <div class="flex flex-wrap items-center gap-y-2 gap-x-1">
              <span class="text-xs text-slate-400 mr-1">状态</span>
              <button type="button" class="filter-btn active" data-filter-status="all">全部</button>
              <button type="button" class="filter-btn" data-filter-status="active">生效中</button>
              <button type="button" class="filter-btn" data-filter-status="used">已用完</button>
              <button type="button" class="filter-btn" data-filter-status="expired">已过期</button>
              <span class="text-xs text-slate-400 mx-2 hidden sm:inline">|</span>
              <span class="text-xs text-slate-400 mr-1">类型</span>
              <button type="button" class="filter-btn active" data-filter-type="all">全部</button>
              <button type="button" class="filter-btn" data-filter-type="tokens">Tokens 包</button>
              <button type="button" class="filter-btn" data-filter-type="vtpm">预留 vTPM 包</button>
            </div>
            <a href="purchase.html" class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg sf-btn-primary text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-plus"></i>兑换中心</a>
          </div>

          <div id="my-package-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <!-- JS 渲染 -->
          </div>
        </div>
      </div>
    </main>
  </div>


  <script>
    const packages = [
      { id: 'P001', type: 'vtpm', name: '预留 vTPM', model: 'Deepseek V4 Flash 0731', amount: 30, unit: '万 vTPM', used: 0, status: 'active', period: '2026-08-01 ~ 2026-08-30', scope: 'Deepseek V4 Flash 0731 推理', pools: ['proj-alpha', 'proj-beta'], serverless: true, requested: ['deepseek-v4-flash-0731', 'deepseek-v4-flash-0731-prod'], bind: ['/proj-alpha/deepseek-v4-flash-0731', '/proj-beta/deepseek-v4-flash-0731'], factors: [
        { input: '0 ~ 128K', cache: '0%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.20, outputF: 1.00 },
        { input: '0 ~ 128K', cache: '0%', output: '512 ~ 4K', inputF: 1.00, cacheF: 0.20, outputF: 2.00 },
        { input: '0 ~ 128K', cache: '50% ~ 100%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.05, outputF: 1.00 },
        { input: '0 ~ 128K', cache: '50% ~ 100%', output: '512 ~ 4K', inputF: 1.00, cacheF: 0.05, outputF: 2.00 },
        { input: '128K ~ 256K', cache: '0%', output: '0 ~ 512', inputF: 1.20, cacheF: 0.24, outputF: 1.00 },
        { input: '128K ~ 256K', cache: '50% ~ 100%', output: '0 ~ 512', inputF: 1.20, cacheF: 0.06, outputF: 1.00 }
      ]},
      { id: 'P002', type: 'vtpm', name: '预留 vTPM', model: 'GLM 5.2', amount: 20, unit: '万 vTPM', used: 0, status: 'active', period: '2026-09-01 ~ 2026-09-30', scope: 'GLM 5.2 推理', pools: ['proj-gamma'], serverless: false, requested: ['glm-5.2', 'glm-5.2-prod'], bind: ['/proj-gamma/glm-5.2'], factors: [
        { input: '0 ~ 128K', cache: '0%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.25, outputF: 1.00 },
        { input: '0 ~ 128K', cache: '50% ~ 100%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.06, outputF: 1.00 }
      ]},
      { id: 'P003', type: 'tokens', name: 'Tokens 包', model: '通用 Tokens', amount: 1200, unit: '万 tokens', remain: 850, status: 'active', period: '2026-06-15 ~ 2026-12-15', scope: '平台按 tokens 计量计费的模型服务', bind: null },
      { id: 'P004', type: 'tokens', name: 'Tokens 包', model: '通用 Tokens', amount: 1000, unit: '万 tokens', remain: 0, status: 'used', period: '2026-05-01 ~ 2026-07-31', scope: '平台按 tokens 计量计费的模型服务', bind: null },
      { id: 'P005', type: 'vtpm', name: '预留 vTPM', model: 'Deepseek V4 Flash 0731', amount: 10, unit: '万 vTPM', used: 0, status: 'expired', period: '2026-07-01 ~ 2026-07-31', scope: 'Deepseek V4 Flash 0731 推理', pools: ['proj-beta'], serverless: false, requested: ['deepseek-v4-flash-0731-demo'], bind: ['/proj-beta/deepseek-v4-flash-0731'], factors: [
        { input: '0 ~ 128K', cache: '0%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.20, outputF: 1.00 },
        { input: '0 ~ 128K', cache: '50% ~ 100%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.05, outputF: 1.00 }
      ]},
      { id: 'P006', type: 'vtpm', name: '预留 vTPM', model: 'Deepseek V4 Flash 0731', amount: 10, unit: '万 vTPM', used: 0, status: 'cancelled', period: '2026-06-01 ~ 2026-06-30', scope: 'Deepseek V4 Flash 0731 推理', pools: ['proj-beta'], serverless: false, requested: ['deepseek-v4-flash-0731-cancelled'], bind: ['/proj-beta/deepseek-v4-flash-0731'], factors: [
        { input: '0 ~ 128K', cache: '0%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.20, outputF: 1.00 },
        { input: '0 ~ 128K', cache: '50% ~ 100%', output: '0 ~ 512', inputF: 1.00, cacheF: 0.05, outputF: 1.00 }
      ]}
    ];

    let currentStatus = 'all';
    let currentType = 'all';

    const statusMap = {
      active: { label: '生效中', cls: 'bg-green-100 text-green-700' },
      used: { label: '已用完', cls: 'bg-slate-100 text-slate-500' },
      expired: { label: '已过期', cls: 'bg-slate-100 text-slate-500' },
      cancelled: { label: '已回收', cls: 'bg-red-50 text-red-600' }
    };

    function getUsedPercent(p) {
      if (p.type === 'tokens') {
        return Math.min(100, Math.round(((p.amount - (p.remain || 0)) / p.amount) * 100));
      }
      return Math.min(100, Math.round((p.used || 0) / p.amount * 100));
    }

    function updatePackageCardCount() {
      const activeCount = packages.filter(p => p.status === 'active').length;
      document.getElementById('package-active-count').textContent = activeCount;
    }

    function renderMyPackages() {
      const grid = document.getElementById('my-package-grid');
      const filtered = packages.filter(p => {
        if (p.status === 'cancelled') return false;
        const statusMatch = currentStatus === 'all' || p.status === currentStatus;
        const typeMatch = currentType === 'all' || p.type === currentType;
        return statusMatch && typeMatch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">暂无符合条件的资源包</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const s = statusMap[p.status];
        const isGray = p.status !== 'active';
        const usedPct = getUsedPercent(p);
        const isVtpm = p.type === 'vtpm';
        const icon = isVtpm ? 'fa-microchip' : 'fa-coins';
        const iconBg = isVtpm ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600';
        const grayIconBg = isGray ? 'bg-slate-100 text-slate-400' : iconBg;
        const textColor = isGray ? 'text-slate-500' : 'text-slate-900';
        const amountColor = isGray ? 'text-slate-400' : 'text-slate-900';
        const typeLabel = isVtpm ? '预留 vTPM' : 'Tokens 包';
        const typeBadgeCls = isVtpm ? 'bg-blue-50 text-blue-700' : 'bg-green-50 text-green-700';
        const grayBadgeCls = isGray ? 'bg-slate-100 text-slate-400' : typeBadgeCls;

        return `
          <div class="sf-card p-5 relative package-item ${p.status} cursor-pointer hover:shadow-md transition-shadow" data-type="${p.type}" onclick="location.href='usage.html?pkg=${p.id}'">
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg ${grayIconBg} flex items-center justify-center"><i class="fa-solid ${icon}"></i></div>
                <div>
                  <h3 class="font-semibold ${textColor}">${p.model}</h3>
                  <span class="inline-block px-2 py-0.5 rounded text-[10px] font-medium ${grayBadgeCls}">${typeLabel}</span>
                </div>
              </div>
              <span class="px-2 py-1 rounded-full text-xs font-medium ${s.cls}">${s.label}</span>
            </div>
            <div class="mb-4">
              <p class="text-3xl font-bold ${amountColor}">
                ${isVtpm ? p.amount : (p.remain ?? p.amount).toLocaleString()}
                <span class="text-base font-normal ${isGray ? 'text-slate-400' : 'text-slate-500'}">${p.unit}</span>
              </p>
              ${!isVtpm && p.status === 'active' ? `<p class="text-xs text-slate-400 mt-1">剩余 ${p.remain} 万 / 共 ${p.amount} 万 tokens</p>` : ''}
            </div>
            <div class="border-t border-slate-100 pt-3 space-y-1 text-xs ${isGray ? 'text-slate-400' : 'text-slate-500'} mb-4">
              <p>可用范围：${p.scope}</p>
              <p>有效期：${p.period}</p>
              ${p.bind ? `<p>绑定：${Array.isArray(p.bind) ? p.bind.join('、') : p.bind}</p>` : `<p>ID：${p.id}</p>`}
            </div>
            <div class="flex items-center gap-3 text-sm">
              ${isVtpm ? `<a href="usage.html?pkg=${p.id}" class="text-violet-600 hover:text-violet-700 font-medium" onclick="event.stopPropagation()">查看详情</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Tab 切换
    function switchBalanceTab(tab) {
      document.querySelectorAll('.package-card-tab').forEach(b => b.classList.remove('active'));
      document.querySelector(`.package-card-tab[data-tab="${tab}"]`).classList.add('active');
      document.getElementById('tab-balance').classList.toggle('hidden', tab !== 'balance');
      document.getElementById('tab-voucher').classList.toggle('hidden', tab !== 'voucher');
      document.getElementById('tab-package').classList.toggle('hidden', tab !== 'package');
    }

    // 状态筛选
    document.querySelectorAll('[data-filter-status]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter-status]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStatus = btn.dataset.filterStatus;
        renderMyPackages();
      });
    });

    // 类型筛选
    document.querySelectorAll('[data-filter-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.dataset.filterType;
        renderMyPackages();
      });
    });

    // URL ?tab=xxx 支持
    const params = new URLSearchParams(location.search);
    const initialTab = params.get('tab') === 'voucher' ? 'voucher' : params.get('tab') === 'package' ? 'package' : 'balance';
    switchBalanceTab(initialTab);
    renderMyPackages();
    updatePackageCardCount();
  </script>
</body>
</html>
